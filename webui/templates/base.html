<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}vinted-scraper{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">🧥 vinted-scraper</div>
    <nav>
      <a href="{{ url_for('index') }}">Dashboard</a>
      <a href="{{ url_for('queries') }}">Searches</a>
      <a href="{{ url_for('items') }}">Items</a>
      <a href="{{ url_for('config_page') }}">Config</a>
      <a href="{{ url_for('logs') }}">Logs</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for m in messages %}<div class="flash-item">{{ m }}</div>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer>
    <a href="https://github.com/RichrdJ/vinted-scraper" target="_blank" rel="noopener">vinted-scraper</a>
  </footer>
</body>
</html>
